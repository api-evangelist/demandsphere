summary: >-
  DemandSphere runs two changelog surfaces and only one of them is public. The
  platform changelog at help.demandsphere.com/changelog answers HTTP 200 but
  renders a Keycloak sign-in page, so no product release history is readable
  without a customer account. The first-party MCP server publishes a dated,
  Keep-a-Changelog-style CHANGELOG.md in its public repository with an explicit
  Breaking section, and that is the only machine-readable release history the
  company publishes. The REST API itself (v5.0) publishes no versioned changelog.
