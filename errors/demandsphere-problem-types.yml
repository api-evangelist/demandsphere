note: >-
  The OpenAPI declares a 400 response on every operation without a response
  schema or an application/problem+json media type, and DemandSphere publishes no
  error-code reference in its public docs, so there is no RFC 9457 problem
  details contract and no documented error registry. The status surface below is
  wider than the spec: DemandSphere's own first-party MCP client handles 401,
  403, 404, 429 and 5xx from api.demandsphere.com with specific messages, which
  is provider-published evidence that those statuses are returned by the API even
  though the spec never declares them.
