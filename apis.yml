aid: demandsphere
name: DemandSphere
description: >-
  DemandSphere is a unified AI search visibility platform (founded 2010, Y
  Combinator S10) that tracks brand presence across traditional search engine
  results pages, AI search engines (ChatGPT, Gemini, Perplexity, AI Overviews,
  AI Mode), and agentic surfaces. Its modular products cover DemandMetrics SERP
  analytics, DemandMetrics for Gen AI (LLM visibility and citation tracking),
  DemandSphere Agents workflow automation, Analytics AX log-file analytics, and
  Search Intelligence, a BigQuery data warehouse. The DemandSphere REST API
  (v5.0) exposes rank tracking, ranking trends, keyword groups, local rankings,
  landing matches, search-engine summaries, and site hierarchy data as JSON over
  api-key authentication, across 200+ markets and 10+ search engines, and is
  complemented by a first-party Model Context Protocol (MCP) server for agent
  access.
