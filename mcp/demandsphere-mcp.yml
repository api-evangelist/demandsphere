  - {name: calculate_model_cost, description: Calculate token costs (defaults to 1M in + 1M out if omitted)}
  - {name: get_providers, description: List all tracked providers with model counts}
  - {name: get_algorithm_updates, description: List/filter Google algorithm updates (2000-present)}
