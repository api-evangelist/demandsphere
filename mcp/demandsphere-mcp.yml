- name: demandsphere
  description: Official DemandSphere MCP server connecting AI assistants to the search intelligence platform.
    Supports traditional SERP analytics (v5.0) and GenAI visibility tracking (v5.1). API-key auth is injected
    server-side (the DemandSphere API uses api_key query-parameter auth); the model never sees the key.
  official: true
  repository: https://github.com/DemandSphereDev/demandsphere-mcp
  language: Python
  license: MIT
  transport:
  - stdio
  - streamable-http
  install:
  - git clone https://github.com/DemandSphereDev/demandsphere-mcp.git && uv sync
  - git clone https://github.com/DemandSphereDev/demandsphere-mcp.git && pip install -e .
  auth: api_key (env DEMANDSPHERE_API_KEY / ~/.config/demandsphere/config.json / .env)
  tools:
