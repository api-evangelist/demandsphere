- name: demandsphere
  description: >-
    Official DemandSphere MCP server connecting AI assistants to the search
    intelligence platform. Supports traditional SERP analytics (v5.0) and GenAI
    visibility tracking (v5.1). API-key auth is injected server-side (the
    DemandSphere API uses api_key query-parameter auth); the model never sees the key.
  official: true
  repository: https://github.com/DemandSphereDev/demandsphere-mcp
  language: Python
  license: MIT
  transport:
  - stdio
  - streamable-http
  install:
  - git clone https://github.com/DemandSphereDev/demandsphere-mcp.git && uv sync
  - git clone https://github.com/DemandSphereDev/demandsphere-mcp.git && pip install -e .
  auth: api_key (env DEMANDSPHERE_API_KEY / ~/.config/demandsphere/config.json / .env)
  tools:
  - {name: list_sites, domain: Site Discovery, description: Discovers configured sites}
  - {name: list_sites_flat, domain: Site Discovery, description: Returns flattened site list}
  - {name: serp_analytics, domain: SERP Analytics, description: 'SERP rankings analysis (views: performance, trends, engine_comparison, engine_summary)'}
  - {name: get_keyword_groups, domain: SERP Analytics, description: Retrieves grouped keyword data}
  - {name: get_local_rankings, domain: SERP Analytics, description: Fetches local search rankings}
  - {name: get_landing_matches, domain: SERP Analytics, description: Identifies landing page matches}
  - {name: get_landings_history, domain: SERP Analytics, description: Tracks landing page history}
  - {name: get_mentions, domain: GenAI Visibility, description: Retrieves GenAI mentions}
  - {name: get_keyword_citations, domain: GenAI Visibility, description: Gets citation data by keyword}
  - {name: get_bulk_citations, domain: GenAI Visibility, description: Processes bulk citation requests}
  - {name: get_site_citations, domain: GenAI Visibility, description: Fetches site-specific citations}
  - {name: llm_analytics, domain: GenAI Visibility, description: 'GenAI visibility analysis (views: stats, performance, channels, cross_channel, cross_llms)'}
  - {name: get_llm_filters, domain: GenAI Visibility, description: Returns available GenAI filters}
  - {name: get_people_also_ask, domain: GenAI Visibility, description: Retrieves people-also-ask data}
  - {name: list_brands, domain: Brand Management, description: Lists configured brands}
  - {name: create_brand, domain: Brand Management, description: Creates a new brand entry}
  - {name: update_brand, domain: Brand Management, description: Modifies an existing brand}
  - {name: delete_brands, domain: Brand Management, description: Removes brands}
  - {name: search, domain: ChatGPT Deep Research, description: Searches via ChatGPT Deep Research}
  - {name: fetch, domain: ChatGPT Deep Research, description: Retrieves content via ChatGPT Deep Research}
- name: demandsphere-radar
