summary: >-
  Binds every DemandSphere MCP tool to the REST operation it actually calls. The
  v5.0 SERP/site tools map 1:1 (and one tool 1:many, via its `view` parameter)
  onto operationIds published in the DemandSphere OpenAPI. The v5.1 GenAI
  visibility and Brand Management tools call REST paths that exist on
  api.demandsphere.com but are NOT described by the published v5.0 OpenAPI, so
  they are recorded as mcp_only with the exact upstream path the server calls.
  The hosted Radar server is a separate product with no REST counterpart at all.
